<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление вентиляцией умного дома</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Верхняя информационная панель -->
        <div class="status-bar">
            <div class="status-left">
                <span id="val-temp">--°C</span>
                <span id="val-humidity">--%</span>
            </div>
            <div class="status-left">
                <span id="val-voltage">--V</span>
                <span id="val-current">--A</span>
                <span id="val-power">--W</span>
            </div>
            <div class="status-right">
				<span id="net-link">LINK</span> 
                <span id="net-bt">BT</span>
                <span id="net-wifi">Wi-Fi</span>
                <span id="net-can">CAN</span>
                <span id="val-time" class="time">--:--</span>
            </div>
        </div>

		<!-- Секция: Выбор сценария -->
		<div class="section-card mode-selector-card">
			<div class="section-title">Режим работы системы</div>
			<div class="select-container">
				<select id="vent-scenario">
					<option value="0">Автоматически по датчикам</option>
					<option value="1">Ручная настройка</option>
					<option value="2">Максимальное проветривание</option>
					<option value="3">Только мастер-спальня</option>
					<option value="4">Две спальни</option>
					<option value="5">Только вторая спальня</option>
					<option value="6">Только гостиная</option>
					<option value="7">Гостиная и спальни</option>
					<option value="8">Никого нет</option>
				</select>
				<div class="select-arrow"></div>
			</div>
		</div>

        <!-- Секция: Вентиляторы -->
        <div class="section-card">
            <div class="section-title">Вентиляторы</div>

            <div class="control-row">
                <div class="label">Приток</div>
                <div class="slider-container">
                    <input type="range" id="fan_in" min="0" max="4" value="0">
                </div>
            </div>

            <div class="control-row">
                <div class="label">Вытяжка</div>
                <div class="slider-container">
                    <input type="range" id="fan_out" min="0" max="4" value="0">
                </div>
            </div>
        </div>

        <!-- Секция: Приточные клапана -->
        <div class="section-card">
            <div class="section-title">Приточные клапана</div>

            <div class="control-row">
                <div class="label">Гостиная</div>
                <div class="slider-container">
                    <input type="range" id="valve_living" min="0" max="100" value="0">
                </div>
            </div>

            <div class="control-row">
                <div class="label">Спальня</div>
                <div class="slider-container">
                    <input type="range" id="valve_bedroom" min="0" max="100" value="0">
                </div>
            </div>

            <div class="control-row">
                <div class="label">Детская</div>
                <div class="slider-container">
                    <input type="range" id="valve_kids" min="0" max="100" value="0">
                </div>
            </div>

            <div class="control-row">
                <div class="label">Кладовка</div>
                <div class="slider-container">
                    <input type="range" id="valve_store" min="0" max="100" value="0">
                </div>
            </div>
        </div>

        <!-- Секция: Вытяжные клапана -->
        <div class="section-card">
            <div class="section-title">Вытяжные клапана</div>

            <div class="exhaust-grid">
                <div class="control-row">
                    <div class="label">Туалет</div>
                    <div class="slider-container">
                        <input type="range" id="valve_toilet" min="0" max="1" value="0">
                    </div>
                </div>

                <div class="control-row">
                    <div class="label">Ванная</div>
                    <div class="slider-container">
                        <input type="range" id="valve_bath" min="0" max="1" value="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
