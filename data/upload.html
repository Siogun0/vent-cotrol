<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузчик файлов ESP32-S3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .upload-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        .file-input-wrapper {
            position: relative;
            margin: 20px 0;
            text-align: center;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            display: block;
            padding: 12px 20px;
            background-color: #3498db;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        .file-label:hover {
            background-color: #2980b9;
        }
        .file-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
            text-align: left;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background: #fafafa;
            display: none;
        }
        .file-item {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
            word-break: break-all;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background-color: #27ae60;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 10px;
            width: 0%;
            background-color: #2ecc71;
            transition: width 0.1s linear;
        }
        .status-text {
            margin-top: 8px;
            font-size: 14px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="upload-container">
    <h2>Загрузка файлов на ESP32</h2>
    
    <form id="uploadForm">
        <div class="file-input-wrapper">
            <!-- Атрибут multiple позволяет выбирать сразу много файлов -->
            <label for="fileInput" class="file-label">Выбрать файлы</label>
            <input type="file" id="fileInput" name="files" multiple required>
        </div>

        <div id="fileList" class="file-list"></div>

        <button type="submit" id="uploadBtn">Загрузить на плату</button>
    </form>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">Ожидание...</div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const uploadForm = document.getElementById('uploadForm');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');

    // Отображение списка выбранных файлов
    fileInput.addEventListener('change', () => {
        fileList.innerHTML = '';
        if (fileInput.files.length > 0) {
            fileList.style.display = 'block';
            Array.from(fileInput.files).forEach(file => {
                const sizeInKb = (file.size / 1024).toFixed(1);
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.textContent = `${file.name} (${sizeInKb} КБ)`;
                fileList.appendChild(fileItem);
            });
        } else {
            fileList.style.display = 'none';
        }
    });

    // Асинхронная отправка файлов на сервер ESP32 через XMLHttpRequest
    uploadForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        if (fileInput.files.length === 0) return;

        const formData = new FormData();
        
        // Добавляем все файлы в один запрос
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append("file", fileInput.files[i], "/" + fileInput.files[i].name);
        }

        const xhr = new XMLHttpRequest();
        
        // Эндпоинт обработки на ESP32. Обычно /upload
        xhr.open("POST", "/upload", true);

        // Блокируем интерфейс на время загрузки
        uploadBtn.disabled = true;
        fileInput.disabled = true;
        progressContainer.style.display = 'block';
        statusText.style.color = '#333';
        statusText.textContent = "Загрузка...";

        // Отслеживание прогресса
        xhr.upload.addEventListener("progress", (e) => {
            if (e.lengthComputable) {
                const percentage = Math.round((e.loaded / e.total) * 100);
                progressFill.style.width = percentage + "%";
                statusText.textContent = `Загружено: ${percentage}%`;
            }
        });

        // Обработка завершения запроса
        xhr.onload = function() {
            if (xhr.status === 200) {
                statusText.style.color = '#2ecc71';
                statusText.textContent = "Успешно загружено!";
                uploadForm.reset();
                fileList.style.display = 'none';
            } else {
                statusText.style.color = '#e74c3c';
                statusText.textContent = `Ошибка сервера: ${xhr.status}`;
            }
            // Разблокируем кнопки
            uploadBtn.disabled = false;
            fileInput.disabled = false;
        };

        xhr.onerror = function() {
            statusText.style.color = '#e74c3c';
            statusText.textContent = "Ошибка сети при отправке.";
            uploadBtn.disabled = false;
            fileInput.disabled = false;
        };

        xhr.send(formData);
    });
</script>

</body>
</html>
